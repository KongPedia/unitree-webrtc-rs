name: Build and Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # Production release from the selected ref; not a TestPyPI dry run.

permissions:
  contents: read

# Do not interrupt an in-progress upload with another release from the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Verify release identity before building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Match pushed tag to manifests and locks
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release.py --tag "$RELEASE_TAG"
      - name: Validate manual release from selected ref (no tag required)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check-release.py

  build-wheels:
    needs: release-metadata
    uses: ./.github/workflows/acceptance.yml
    with:
      build-wheel: true

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unitree-webrtc-rs
    permissions:
      id-token: write # Existing policy; API token publication below is unchanged.

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lah dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: false
          password: ${{ secrets.PYPI_API_TOKEN }}
