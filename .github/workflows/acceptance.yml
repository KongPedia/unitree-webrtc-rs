name: Offline acceptance

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:
    inputs:
      build-wheel:
        description: Build and validate release wheels after acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Accept ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.7.19"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-broken \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            libopus-dev \
            pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gstreamer opus pkg-config

      - name: Verify required runtime media plugins
        run: |
          for element in appsrc appsink h264parse avdec_h264 videoconvert uridecodebin audioconvert audioresample opusenc rtpopuspay; do
            gst-inspect-1.0 --exists "$element"
          done

      - name: Sync uv dependencies
        run: uv sync --locked --dev --no-install-project --python "${{ matrix.python-version }}"

      - name: Read checked-in Rust toolchain
        id: toolchain
        run: |
          uv run --locked --no-sync python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          toolchain = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']
          print('channel=' + toolchain['channel'])
          print('components=' + ','.join(toolchain['components']))
          PY

      - name: Install checked-in Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Identify Python ABI and Rust toolchain for build cache
        id: build-cache
        run: |
          uv run --locked --no-sync python -c 'import platform, sysconfig; print("python=" + platform.python_version() + "-" + sysconfig.get_config_var("SOABI"))' >> "$GITHUB_OUTPUT"
          echo "rust=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-downloads-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-downloads-v2-

      - name: Cache Rust build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-target-v2-${{ steps.build-cache.outputs.python }}-${{ steps.build-cache.outputs.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-target-v2-${{ steps.build-cache.outputs.python }}-${{ steps.build-cache.outputs.rust }}-

      - name: Validate manifest and lock project versions
        run: uv run --locked --no-sync python scripts/check-release.py

      - name: Offline acceptance (Rust, core and freshly built native Python)
        run: make acceptance

      - name: Build wheels with maturin
        if: inputs.build-wheel == true
        run: uv run --locked --no-sync maturin build --release --out dist --locked

      - name: Record artifact identity and build provenance
        if: inputs.build-wheel == true
        run: |
          {
            printf 'source-commit: '; git rev-parse HEAD
            printf 'workflow-ref: %s\nrun-id: %s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID"
            rustc -vV
            cargo --version
            uv --version
            uv run --locked --no-sync python -VV
            uv run --locked --no-sync maturin --version
            for wheel in dist/*.whl; do
              uv run --locked --no-sync python scripts/check-release.py --wheel "$wheel"
            done
          } > release-evidence.txt
          cat release-evidence.txt

      - name: Fresh wheel native contracts outside repository
        if: inputs.build-wheel == true
        run: |
          for wheel in dist/*.whl; do
            uv run --locked --no-sync python scripts/smoke-wheel.py "$wheel"
          done

      - name: Upload wheels as artifacts
        if: inputs.build-wheel == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

      - name: Upload release evidence
        if: inputs.build-wheel == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-evidence-${{ matrix.os }}-${{ matrix.python-version }}
          path: release-evidence.txt
          if-no-files-found: error
          retention-days: 7
